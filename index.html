<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WM Generate</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(90vw, 720px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 48px 32px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.5);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.2rem, 5vw, 4rem);
      }

      p {
        margin: 0;
        font-size: 1.08rem;
        color: var(--muted);
        line-height: 1.8;
      }

      .badge {
        display: inline-block;
        margin-bottom: 18px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.4);
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Published</div>
      <h1>WM Generate</h1>
      <p>這個頁面已經準備完成並可直接發布到 GitHub Pages 或任何靜態站台。</p>
    </main>
  </body>
</html>
